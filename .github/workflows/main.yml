name: Build
on: push
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemShatalov/buildozer-action@v1
        with:
          command: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: bin/*.apk

